name: Sample deal blurbs

# Tone check only. Prints blurbs for the current feed and does not commit,
# archive, or post. Run from the Actions tab, or locally with
# `npm run blurbs:sample` inside pipeline/.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Write blurbs for the current feed
        working-directory: pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node src/sampleBlurbs.js
