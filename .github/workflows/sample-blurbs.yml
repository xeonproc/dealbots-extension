name: Sample deal blurbs

# Tone check only. Prints blurbs for the current feed and does not commit,
# archive, or post. Runs on a pull request that touches the blurb prompt,
# and from the Actions tab once this file is on the default branch.
# Locally: `npm run blurbs:sample` inside pipeline/.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - pipeline/src/rankWithClaude.js
      - pipeline/src/sampleBlurbs.js
      - pipeline/src/anthropic.js
      - .github/workflows/sample-blurbs.yml

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Write blurbs for the current feed
        working-directory: pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node src/sampleBlurbs.js
