<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Deal of the Day</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1 id="heading">Deal of the Day</h1>
    <span id="date"></span>
  </header>
  <p id="stale-notice" hidden></p>

  <main id="content">
    <div id="loading" role="status" aria-live="polite" aria-busy="true">
      <div class="skeleton-image">
        <span class="spinner" aria-hidden="true"></span>
        <p id="status">Loading today's deal...</p>
      </div>
      <div class="skeleton" aria-hidden="true">
        <div class="skeleton-line title"></div>
        <div class="skeleton-line title narrow"></div>
        <div class="skeleton-line why"></div>
        <div class="skeleton-line blurb"></div>
        <div class="skeleton-line blurb narrow"></div>
        <div class="skeleton-price"></div>
        <div class="skeleton-button"></div>
        <div class="skeleton-button ghost"></div>
      </div>
    </div>

    <div id="message-panel" class="message-panel" hidden role="status" aria-live="polite">
      <p id="message-title" class="message-title"></p>
      <p id="message-detail" class="message-detail"></p>
      <button type="button" id="retry" hidden>Retry</button>
    </div>

    <div id="deal-slot"></div>
  </main>

  <template id="deal-template">
    <article class="deal">
      <img class="deal-image" alt="" referrerpolicy="no-referrer" />
      <div class="deal-body">
        <h2 class="deal-title"></h2>
        <p class="deal-why-label" hidden>Why this made the cut</p>
        <p class="deal-blurb"></p>
        <div class="deal-price-row">
          <span class="deal-price"></span>
          <span class="deal-discount"></span>
          <span class="deal-trust" hidden></span>
        </div>
        <span class="deal-code-badge"></span>
        <a class="deal-buy" target="_blank" rel="noopener noreferrer">Buy Now</a>
        <button type="button" class="deal-share">Share with a friend</button>
      </div>
    </article>
  </template>

  <footer>
    <div class="footer-row source-row">
      <span id="source-note"></span>
      <a id="more-deals-link" target="_blank" rel="noopener noreferrer" hidden>See other deals →</a>
      <span id="footer-bones" class="footer-bones" hidden aria-hidden="true">
        <span class="bone bone-note"></span>
        <span class="bone bone-note short"></span>
        <span class="bone bone-link"></span>
      </span>
    </div>
    <div class="footer-row follow-row">
      <span>Get tomorrow's deal:</span>
      <a id="telegram-link" target="_blank" rel="noopener noreferrer">Telegram</a>
      <a id="mastodon-link" target="_blank" rel="noopener noreferrer">Mastodon</a>
    </div>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
