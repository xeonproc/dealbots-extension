<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Deal of the Day</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>Deal of the Day</h1>
    <span id="date"></span>
  </header>

  <main id="content">
    <p id="status">Loading today's deal...</p>
  </main>

  <template id="deal-template">
    <article class="deal">
      <img class="deal-image" alt="" referrerpolicy="no-referrer" />
      <div class="deal-body">
        <h2 class="deal-title"></h2>
        <p class="deal-blurb"></p>
        <div class="deal-price-row">
          <span class="deal-price"></span>
          <span class="deal-discount"></span>
        </div>
        <span class="deal-code-badge"></span>
        <a class="deal-buy" target="_blank" rel="noopener noreferrer">Buy Now</a>
      </div>
    </article>
  </template>

  <footer>
    <div class="footer-row">
      <span id="source-note"></span>
      <a id="more-deals-link" target="_blank" rel="noopener noreferrer">See other deals →</a>
    </div>
    <div class="footer-row follow-row">
      <span>Get tomorrow's deal:</span>
      <a id="telegram-link" target="_blank" rel="noopener noreferrer">Telegram</a>
      <a id="mastodon-link" target="_blank" rel="noopener noreferrer">Mastodon</a>
    </div>
  </footer>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
